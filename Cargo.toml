[workspace]
resolver = "3"
members = [
  "crates/http-cache",
  "crates/middleware",
  "crates/platform",
  "crates/postgres",
  "crates/worker",
]

[workspace.dependencies]
alternate-codec = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/foundation", rev = "31f4e3fa3360b42c2ba0c77dc848d13989722a13" }
alternate-crypto = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/foundation", rev = "31f4e3fa3360b42c2ba0c77dc848d13989722a13" }
alternate-domain = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/foundation", rev = "31f4e3fa3360b42c2ba0c77dc848d13989722a13" }
alternate-http = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/platform", rev = "c836583dc25320e43ec9bd2895edb358655825be" }
alternate-kv = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/platform", rev = "c836583dc25320e43ec9bd2895edb358655825be" }
alternate-http-cache.path = "crates/http-cache"
alternate-migration = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/platform", rev = "c836583dc25320e43ec9bd2895edb358655825be" }
alternate-platform.path = "crates/platform"
alternate-queue = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/platform", rev = "c836583dc25320e43ec9bd2895edb358655825be" }

anyhow = "1.0.104"
jiff = "0.2.35"
serde.version = "1.0.229"
thiserror = "2.0.20"
tracing = "0.1.44"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"