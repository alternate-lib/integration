[workspace]
resolver = "3"
members = ["crates/middleware", "crates/platform", "crates/worker"]

[workspace.dependencies]
alternate-codec = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/foundation", rev = "d68ecfdc1ec597dbf3e499d5912a04ec0a943c83" }
alternate-http = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/platform", rev = "c836583dc25320e43ec9bd2895edb358655825be" }
alternate-kv = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/platform", rev = "c836583dc25320e43ec9bd2895edb358655825be" }
alternate-queue = { version = "0.1.0", registry = "self-hosted", git = "https://git.thealternate.dev/alternate/platform", rev = "c836583dc25320e43ec9bd2895edb358655825be" }

anyhow = "1.0.104"
serde.version = "1.0.229"
thiserror = "2.0.20"
tracing = "0.1.44"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
